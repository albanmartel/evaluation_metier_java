<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" style="width:523px;height:725px;background:#000000;" width="523px" height="725px" viewBox="0 0 523 725" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><text x="5" y="17" fill="#33FF02" font-size="12" textLength="360.188" font-weight="700" font-style="italic">PlantUML version 1.2026.8 / 149874a [2026-09-05 15:59:17 UTC]</text><rect x="5" y="28.094" width="512.31" height="22.609" fill="#33FF02" style="stroke:#33FF02;stroke-width:1;"/><text x="6" y="43.094" fill="#000" font-size="14" textLength="510.31" font-weight="700">[From sequence_diagram_for-the-Training_Sales-Application.puml (line 36) ]</text><text x="5" y="64.703" fill="#33FF02" font-size="14" font-weight="700"> </text><text x="5" y="82.313" fill="#33FF02" font-size="14" textLength="68.886" font-weight="700">@startuml</text><text x="5" y="99.922" fill="#33FF02" font-size="14" textLength="80.89" font-weight="700">autonumber</text><text x="5" y="117.531" fill="#33FF02" font-size="14" textLength="170.454" font-weight="700">actor "Visitor / User" as V</text><text x="5" y="135.141" fill="#33FF02" font-size="14" textLength="171.227" font-weight="700">participant "System" as S</text><text x="5" y="152.75" fill="#33FF02" font-size="14" font-weight="700"> </text><text x="5" y="170.359" fill="#33FF02" font-size="14" textLength="196.096" font-weight="700">== 1. Recherche &amp; Filtrage ==</text><text x="5" y="187.969" fill="#33FF02" font-size="14" textLength="299.141" font-weight="700">V -> S: Parcourir le catalogue des formations</text><text x="5" y="205.578" fill="#33FF02" font-size="14" textLength="189.424" font-weight="700">S --> V: Liste des formations</text><text x="5" y="223.188" fill="#33FF02" font-size="14" font-weight="700"> </text><text x="5" y="240.797" fill="#33FF02" font-size="14" textLength="261.871" font-weight="700">V -> S: Rechercher par mot (ex: "Java")</text><text x="5" y="258.406" fill="#33FF02" font-size="14" textLength="206.575" font-weight="700">S --> V: Résultats de recherche</text><text x="5" y="276.016" fill="#33FF02" font-size="14" font-weight="700"> </text><text x="5" y="293.625" fill="#33FF02" font-size="14" textLength="285.182" font-weight="700">V -> S: Filtrer par "Distantiel ou Présentiel"</text><text x="5" y="311.234" fill="#33FF02" font-size="14" textLength="299.934" font-weight="700">S --> V: Formation "Java en ligne" disponible</text><text x="5" y="328.844" fill="#33FF02" font-size="14" font-weight="700"> </text><text x="5" y="346.453" fill="#33FF02" font-size="14" textLength="196.882" font-weight="700">== 2. Réservation &amp; Panier ==</text><text x="5" y="364.063" fill="#33FF02" font-size="14" textLength="246.982" font-weight="700">V -> S: Ajouter la formation au panier</text><text x="5" y="381.672" fill="#33FF02" font-size="14" textLength="338.81" font-weight="700">S -> S: Créer un nouveau panier (si aucun n’existe)</text><text x="5" y="399.281" fill="#33FF02" font-size="14" textLength="165.327" font-weight="700">S --> V: Panier mis à jour</text><text x="5" y="416.891" fill="#33FF02" font-size="14" font-weight="700"> </text><text x="5" y="434.5" fill="#33FF02" font-size="14" textLength="287.861" font-weight="700">== 3. Tentative de Commande &amp; Compte ==</text><text x="5" y="452.109" fill="#33FF02" font-size="14" textLength="306.968" font-weight="700">V -> S: Valider le panier / Passer la commande</text><text x="5" y="469.719" fill="#33FF02" font-size="14" textLength="396.539" font-weight="700">S --> V: Demander la création d'un compte (Non authentifié)</text><text x="5" y="487.328" fill="#33FF02" font-size="14" font-weight="700"> </text><text x="5" y="504.938" fill="#33FF02" font-size="14" textLength="427.089" font-weight="700">alt Scénario Alternatif 1 : Abandon lors de la création de compte</text><text x="20.559" y="522.547" fill="#33FF02" font-size="14" textLength="312.354" font-weight="700">V -> S: Annuler / Refuser la création de compte</text><text x="20.559" y="540.156" fill="#33FF02" font-size="14" textLength="223.651" font-weight="700">S -> S: Abandonner la commande</text><text x="20.559" y="557.766" fill="#33FF02" font-size="14" textLength="368.354" font-weight="700">S --> V: Commande annulée (Pas de compte utilisateur)</text><text x="5" y="575.375" fill="#33FF02" font-size="14" font-weight="700"> </text><text x="5" y="592.984" fill="#33FF02" font-size="14" textLength="246.641" font-weight="700">else Scénario Nominal : Compte créé</text><text x="20.559" y="610.594" fill="#33FF02" font-size="14" textLength="311.801" font-weight="700">V -> S: Saisir nom d'utilisateur et mot de passe</text><text x="20.559" y="628.203" fill="#33FF02" font-size="14" textLength="289.83" font-weight="700">S -> S: Créer et activer le compte utilisateur</text><text x="20.559" y="645.813" fill="#33FF02" font-size="14" textLength="443.803" font-weight="700">S --> V: Compte actif (Commande en attente des infos bénéficiaire)</text><text x="5" y="663.422" fill="#33FF02" font-size="14" font-weight="700"> </text><text x="20.559" y="681.031" fill="#33FF02" font-size="14" textLength="24.89" font-weight="700">end</text><text x="5" y="698.641" fill="#33FF02" font-size="14" textLength="24.89" font-weight="700" text-decoration="wavy underline">end</text><text x="8.89" y="716.25" fill="#F00" font-size="14" textLength="377.303" font-weight="700">Cannot create group (Assumed diagram type: sequence)</text><?plantuml-src PLHBRjim4Dth50zQfCuY3jBk33X0a22BeWW2k_L-B8qS5XHfy6EakrwZksvz3j-a9-cGaYKx5Y104cVURqXH3DR4Tiske2fOXtAbl4eFj_ZXsPKWZrMn9HTKfRPa0ihbBn-upIlBefZFSJV5WgitTdBZ2izA1qSRndnUh71pZ-KCh-Gg6vroq8oA0ccxYOoQFHhhMWhA6byiSIFbgnc-AQ7uk3g03MGE8Woj3PZm-mpbLzfHUJt2B0vx7tMWu0KBxjWs8cMfFKpv9AHYKB66ZNXrqipvjHmHduzoEZAmWLORmoLgvRVMgBNcdCddQMPdj-lAhoG2euJg99I7dpO6-QHfj0cAeYPL9j9SzYXAf2eQ61jtF1HWufMKLsdXt-y__9v2Et7V4xRAu_0NmkMoiYzJV1TVmhPB4UFH